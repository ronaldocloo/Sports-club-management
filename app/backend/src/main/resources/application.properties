spring.application.name=sports-club

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sports_club}
spring.datasource.username=${DB_USER:sportsteam}
spring.datasource.password=${DB_PASSWORD:sportsteam}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

# Sessions: HTTP-only cookie, 30 minutes of inactivity, not sent on cross-site requests.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Sessions are stored in the database (tables from schema/08_sessions.sql), so instances share them and restarts keep them.
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 * * * * *

# Health check for containers and load balancers. Nothing else is exposed, and no details.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# First platform administrator on a fresh install. Leave the password empty to skip.
# Set app.bootstrap.superadmin-password (env APP_BOOTSTRAP_SUPERADMIN_PASSWORD) once, then remove it.
app.bootstrap.superadmin-username=superadmin
app.bootstrap.superadmin-password=

# Demo data (never on by default). See docs/DEMO.md.
app.demo.seed=false
app.demo.password=

# Email (optional). Password-reset links are only offered when SMTP is configured: set SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, APP_MAIL_FROM and APP_PUBLIC_URL (the address people use to open the site).
# Both default to on. Turn authentication off for an internal relay that does not ask for a login (MAIL_AUTH=false in compose).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
management.health.mail.enabled=false
app.mail.from=
app.public-url=http://localhost:5173

