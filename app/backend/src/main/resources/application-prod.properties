# Production profile: run with SPRING_PROFILES_ACTIVE=prod. Nothing here has a default, so a missing
# setting stops the app from starting instead of quietly using a development value.
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Serve over HTTPS only and never send the session cookie over plain HTTP.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.forward-headers-strategy=native

# Bound request sizes.
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=1MB
spring.servlet.multipart.enabled=false

# Do not echo internal error text.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
