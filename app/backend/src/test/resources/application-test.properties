# Integration tests run against a throwaway database created by scripts/setup-test-db.sh.
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_TEST_NAME:sports_club_test}
spring.datasource.username=${DB_USER:sportsteam}
spring.datasource.password=${DB_PASSWORD:sportsteam}
spring.jpa.hibernate.ddl-auto=validate

# Tests make many rapid requests from one address.
app.rate-limit.enabled=false
logging.level.org.hibernate.SQL=warn

# Most tests hand MockMvc a MockHttpSession, which bypasses the session filter, so they use plain in-memory sessions.
# SharedSessionIntegrationTest turns database-backed sessions back on to test that path with real cookies.
spring.autoconfigure.exclude=org.springframework.boot.session.jdbc.autoconfigure.JdbcSessionAutoConfiguration,org.springframework.boot.session.autoconfigure.SessionAutoConfiguration

