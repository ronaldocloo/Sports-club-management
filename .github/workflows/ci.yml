name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_ADMIN_ARGS: -h127.0.0.1 -uroot -pci-root
      DB_GRANT_HOST: '%'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Create the test database
        run: scripts/setup-test-db.sh
      - name: Run tests
        working-directory: app/backend
        run: ./mvnw -B test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (demo mode)
    runs-on: ubuntu-latest
    needs: frontend
    defaults: { run: { working-directory: app/frontend } }
    env:
      CI: 'true'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: app/frontend/playwright-report }
