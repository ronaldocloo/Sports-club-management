name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_ADMIN_ARGS: -h127.0.0.1 -uroot -pci-root
      DB_GRANT_HOST: '%'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Create the test database
        run: scripts/setup-test-db.sh
      - name: Run tests
        working-directory: app/backend
        run: ./mvnw -B test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (demo mode)
    runs-on: ubuntu-latest
    needs: frontend
    defaults: { run: { working-directory: app/frontend } }
    env:
      CI: 'true'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: app/frontend/playwright-report }

  stack:
    name: Containers build and run together
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configure a throwaway stack
        run: |
          cp deploy/.env.example .env
          {
            echo "DB_ROOT_PASSWORD=ci-root-$(openssl rand -hex 8)"
            echo "DB_PASSWORD=ci-app-$(openssl rand -hex 8)"
            echo "COOKIE_SECURE=false"
            echo "SUPERADMIN_PASSWORD=Ci-Super-$(openssl rand -hex 4)9"
            echo "DEMO_SEED=true"
            echo "DEMO_PASSWORD=Ci-Demo-$(openssl rand -hex 4)9"
          } >> .env
      - name: Build and start (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The site and the API answer through nginx
        run: |
          curl -fsS http://localhost:8088/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8088/some/deep/link | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8088/api/auth/me)" = "401"
          curl -fsSI http://localhost:8088/ | grep -qi 'content-security-policy'
      - name: Seeded, and the application account cannot alter the schema
        run: |
          docker compose logs backend | grep -q "Seeded demo organization"
          ! docker compose exec -T db sh -c 'mariadb -u"$MARIADB_USER" -p"$MARIADB_PASSWORD" "$MARIADB_DATABASE" -e "DROP TABLE athlete"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

